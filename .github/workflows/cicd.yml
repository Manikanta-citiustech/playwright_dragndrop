name: This CICD for Playwright Tests

permissions:
  contents: write
  
on:
  workflow_dispatch:

  pull_request:
    branches: [main]

jobs: 
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: lts/*

        - name: Install dependencies
          run: npm ci

        - name: Install Playwright Browsers
          run: npx playwright install --with-deps  

        - name: Run Playwright tests
          run: npm run test