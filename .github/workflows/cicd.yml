name: This CICD for Playwright Tests

permissions:
  contents: write
  
on:
  workflow_dispatch:

  pull_request:
    branches: [main]

jobs: 
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Set up Node.js
          uses: actions/setup-node@v2
          with:
            node-version: '16'

        - name: Install dependencies
          run: npm install

        - name: Run Playwright tests
          run: npm run test